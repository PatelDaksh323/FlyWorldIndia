<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Primary meta (per-page values are overridden at runtime via SEO/Helmet
         and at build time by the prerender step). These are the safe defaults. -->
    <title>Flyworld India — Study Abroad, Work Permits & PR Consultants</title>
    <meta
      name="description"
      content="Flyworld India is a trusted overseas education & immigration consultancy in Ahmedabad. Study Abroad, Europe Work Permits, Visitor Visas and PR — honest guidance, transparent costs, real results."
    />
    <meta name="theme-color" content="#070C1E" />
    <link rel="canonical" href="https://www.flyworldindia.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Flyworld India" />
    <meta
      property="og:title"
      content="Flyworld India — Your Global Mobility Partner"
    />
    <meta
      property="og:description"
      content="Study Abroad, Europe Work Permits, Visitor Visas and PR. Honest guidance for a life-changing decision."
    />
    <meta property="og:image" content="https://www.flyworldindia.com/og-image.png" />
    <meta property="og:url" content="https://www.flyworldindia.com/" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts: Inter (sans) + Fraunces (display). Preconnect for speed. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Organization structured data (trust + local SEO) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Flyworld India",
        "url": "https://www.flyworldindia.com/",
        "description": "Overseas education & immigration consultancy — Study Abroad, Europe Work Permits, Visitor Visas and PR.",
        "areaServed": "IN",
        "knowsAbout": ["Study Abroad", "Work Permit", "Visitor Visa", "Permanent Residency"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: sans-serif; color: #F6F4EC; background: #070C1E">
        Flyworld India — Study Abroad, Work Permits & PR consultants in Ahmedabad.
        Please enable JavaScript, or reach us on WhatsApp / phone. This site works
        best with JavaScript enabled.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
